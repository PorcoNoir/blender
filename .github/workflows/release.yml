# Blender-SML release pipeline.
#
# Trigger: push a tag like `blender-sml-v0.1.0`. The job builds the fork on
# Windows with the gate-required MSVC, packages the install tree, and publishes
# a GitHub Release whose notes come from tools/sysml/releases/<tag>.md.
#
# Versioning: the tag IS the version (semver), and should match the Jira
# Release/Fix Version name. See tools/sysml/releases/ for notes per version.
#
# CAVEATS (read before relying on this in anger):
#   * Blender is a *heavy* build. GitHub-hosted runners have limited disk
#     (~14 GB free on C:) and a 6 h job cap; a full build + precompiled
#     libraries can exceed the disk budget. If this fails on space/time, move
#     to a SELF-HOSTED runner with the libraries pre-fetched and the toolchain
#     pre-installed (recommended for real releases).
#   * MSVC pin: Blender requires cl >= 19.44.35216 (VS 2022 17.14.14). Hosted
#     runners track their own VS patch; the BLI_normalized_int_types.hh fix in
#     this fork means any 19.44+ builds, so we use the runner's VS and only
#     fail if it is below the gate. To pin an exact patch, pre-install it via
#     the Visual Studio installer on a self-hosted runner.
#   * USD/Hydra are OFF to match the BSML0 spike build; flip them on once a
#     release needs them.

name: Blender-SML Release

on:
  push:
    tags:
      - "blender-sml-v*"

permissions:
  contents: write  # required to create the GitHub Release

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      BUILD_DIR: ${{ github.workspace }}\..\build_release
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          # Library + addon submodules are fetched by make_update below (the
          # lib submodule lives on projects.blender.org and is large/LFS), so
          # we skip recursive submodule checkout here.
          #
          # LFS is fetched from upstream in the next step, NOT here: the GitHub
          # fork does not host the Blender LFS objects (they live on
          # projects.blender.org), so checkout's own lfs:true 404s.
          submodules: false
          lfs: false
          fetch-depth: 1

      - name: Fetch LFS objects from upstream Blender
        shell: bash
        run: |
          git config lfs.url https://projects.blender.org/blender/blender.git/info/lfs
          git lfs install --local
          GIT_TERMINAL_PROMPT=0 git lfs pull

      - name: Show available disk
        shell: pwsh
        run: Get-PSDrive C | Select-Object Used, Free

      - name: Fetch precompiled libraries + source submodules
        shell: cmd
        # make_update pulls the platform libraries (lib/windows_x64) and the
        # source submodules (addons, translations, ...). --no-blender skips
        # updating the already-checked-out blender git itself.
        run: python build_files\utils\make_update.py --no-blender

      - name: Set up MSVC dev environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify compiler meets the Blender gate (>= 19.44.35216)
        shell: pwsh
        run: cl 2>&1 | Select-String "Version"

      - name: Configure (CMake + Ninja)
        shell: cmd
        run: >
          cmake -S . -B "%BUILD_DIR%" -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DWITH_USD=OFF -DWITH_HYDRA=OFF

      - name: Build and install
        shell: cmd
        run: cmake --build "%BUILD_DIR%" --target install --parallel

      - name: Smoke-test + run SysML node suite
        shell: cmd
        # Fail the release if the SysML feature tests regress. Covers the node
        # tree/nodes (BSML1), end-to-end import, and the tutorial-corpus import
        # fidelity gate (BSML2). sml2c is installed next to blender.exe by the
        # install step, so the import/corpus gates run for real here.
        run: >
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_nodetree.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_import.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_corpus.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_export.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_roundtrip.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_export_bpy.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_export_ops.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_bsml3_exit.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_geometry.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_animation_lib.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_time.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_bone_binding.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_rig.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_constraints.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_keyframes.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_behavior.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_capture.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_animation_exit.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_sync.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_methodology.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_animation_b_exit.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_diagnostics.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_structure.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_validate.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_text.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_nodes_to_text.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_text_binding.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_bsml4_exit.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_stdlib_index.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_geometry_shapes.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_binding.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_materialize.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_csg.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_units.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_reverse.py &&
          "%BUILD_DIR%\bin\blender.exe" --background --factory-startup
          --python tests\python\bl_sysml_geometry_exit.py

      - name: Package install tree
        shell: pwsh
        run: |
          $zip = "$env:GITHUB_WORKSPACE\${{ github.ref_name }}-windows-x64.zip"
          Compress-Archive -Path "$env:BUILD_DIR\bin\*" -DestinationPath $zip
          "ASSET=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          # Notes file must exist for this version, e.g.
          # tools/sysml/releases/blender-sml-v0.1.0.md
          body_path: tools/sysml/releases/${{ github.ref_name }}.md
          files: ${{ env.ASSET }}
          draft: false
          prerelease: true  # 0.x = pre-1.0; drop once stable
          fail_on_unmatched_files: true

      - name: Mark the matching Jira version as Released
        # Runs only after a successful publish. Finds the Jira version whose
        # name equals the git tag (e.g. blender-sml-v0.1.0) in the YSL/SCRUM
        # project and flips it to Released. No-ops with a notice if the Jira
        # secret is absent, so forks without it still pass.
        shell: pwsh
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:JIRA_API_TOKEN)) {
            Write-Host "::notice::JIRA_API_TOKEN secret not set - skipping Jira release update."
            exit 0
          }
          $site = "https://sysmlv2.atlassian.net"
          $projectId = 10000
          $auth = [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes(("{0}:{1}" -f $env:JIRA_EMAIL, $env:JIRA_API_TOKEN)))
          $headers = @{ Authorization = "Basic $auth"; Accept = "application/json" }
          $today = (Get-Date -Format "yyyy-MM-dd")

          # Locate the version by name (paginated project-versions endpoint).
          $version = $null; $startAt = 0
          do {
            $page = Invoke-RestMethod -Method Get -Headers $headers `
              -Uri "$site/rest/api/3/project/$projectId/version?startAt=$startAt&maxResults=50"
            $version = $page.values | Where-Object { $_.name -eq $env:VERSION_NAME } | Select-Object -First 1
            $startAt += [int]$page.maxResults
          } while (-not $version -and -not $page.isLast)

          if ($version) {
            Write-Host "Marking Jira version '$($env:VERSION_NAME)' (id=$($version.id)) as Released."
            $body = @{ released = $true; releaseDate = $today } | ConvertTo-Json
            Invoke-RestMethod -Method Put -Headers $headers -ContentType "application/json" `
              -Uri "$site/rest/api/3/version/$($version.id)" -Body $body | Out-Null
          }
          else {
            Write-Host "Version '$($env:VERSION_NAME)' not found; creating it as Released."
            $body = @{ name = $env:VERSION_NAME; projectId = $projectId; released = $true; releaseDate = $today } |
              ConvertTo-Json
            Invoke-RestMethod -Method Post -Headers $headers -ContentType "application/json" `
              -Uri "$site/rest/api/3/version" -Body $body | Out-Null
          }
          Write-Host "Jira version update complete."
